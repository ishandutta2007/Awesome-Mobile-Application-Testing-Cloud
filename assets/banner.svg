<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f0f9ff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="url(#gridGrad)" stroke-width="0.8" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.65; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1.1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(0.9) translate(-30px, 20px); opacity: 0.6; }
    }
    @keyframes floatPhone {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes floatTablet {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-1.5deg); }
    }
    @keyframes waveFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    @keyframes radarPing {
      0% { r: 10; opacity: 0.8; stroke-width: 2; }
      100% { r: 65; opacity: 0; stroke-width: 0.5; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 0.7; }
      85% { opacity: 0.7; }
      100% { transform: translateY(140px); opacity: 0; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .orb-1 { animation: pulseOrb 12s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 14s ease-in-out infinite; transform-origin: 1000px 300px; }
    .floating-phone { animation: floatPhone 6s ease-in-out infinite; }
    .floating-tablet { animation: floatTablet 7s ease-in-out infinite; }
    .stream-wave { stroke-dasharray: 8 6; animation: waveFlow 4s linear infinite; }
    .stream-wave-fast { stroke-dasharray: 6 4; animation: waveFlow 2.5s linear infinite; }
    .radar { animation: radarPing 3.5s cubic-bezier(0.1, 0.7, 0.4, 1) infinite; }
    .radar-delayed { animation: radarPing 3.5s cubic-bezier(0.1, 0.7, 0.4, 1) infinite 1.75s; }
    .scanner { animation: scanLine 3.5s ease-in-out infinite; }
    .blinker-1 { animation: blinkDot 2s ease-in-out infinite; }
    .blinker-2 { animation: blinkDot 2.5s ease-in-out infinite 0.7s; }
    .blinker-3 { animation: blinkDot 1.8s ease-in-out infinite 1.2s; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Deep Background -->
  <circle class="orb-1" cx="200" cy="90" r="170" fill="#0284c7" filter="url(#glow)" />
  <circle class="orb-2" cx="1020" cy="330" r="190" fill="#7c3aed" filter="url(#glow)" />
  <circle cx="620" cy="380" r="140" fill="#4338ca" opacity="0.3" filter="url(#glow)" />

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="420" fill="url(#techGrid)" />

  <!-- Dynamic Decorative Data Streams (Background layer behind text) -->
  <g opacity="0.45">
    <path class="stream-wave" d="M -50 80 Q 250 140 550 70 T 1250 100" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path class="stream-wave-fast" d="M -50 350 Q 300 280 650 360 T 1250 310" fill="none" stroke="#a78bfa" stroke-width="1.8" />
    <path class="stream-wave" d="M -50 200 Q 400 260 800 170 T 1250 220" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- Left Dynamic Device Element (Mobile Smartphone) -->
  <g class="floating-phone" transform="translate(60, 95)">
    <!-- Device Shadow -->
    <rect x="10" y="15" width="110" height="210" rx="22" fill="#000000" opacity="0.5" filter="url(#glow)" />
    <!-- Device Body -->
    <rect x="0" y="0" width="110" height="210" rx="22" fill="#0f172a" stroke="url(#cyanPurple)" stroke-width="2.5" />
    <!-- Screen -->
    <rect x="7" y="12" width="96" height="186" rx="14" fill="#030712" />
    
    <!-- Screen Content: Cloud Test Execution Simulation -->
    <circle cx="55" cy="40" r="14" fill="#0284c7" opacity="0.3" />
    <path d="M 48 40 Q 55 30 62 40" stroke="#38bdf8" stroke-width="2" fill="none" />
    <circle class="blinker-1" cx="80" cy="25" r="3" fill="#22c55e" />
    
    <rect x="18" y="70" width="60" height="5" rx="2.5" fill="#38bdf8" opacity="0.8" />
    <rect x="18" y="82" width="74" height="4" rx="2" fill="#64748b" opacity="0.5" />
    <rect x="18" y="92" width="45" height="4" rx="2" fill="#64748b" opacity="0.5" />

    <!-- Test Passed Checkpoints -->
    <g transform="translate(18, 112)">
      <circle cx="5" cy="5" r="4" fill="#10b981" />
      <line x1="16" y1="5" x2="65" y2="5" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    </g>
    <g transform="translate(18, 130)">
      <circle cx="5" cy="5" r="4" fill="#10b981" />
      <line x1="16" y1="5" x2="52" y2="5" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    </g>
    <g transform="translate(18, 148)">
      <circle cx="5" cy="5" r="4" fill="#38bdf8" class="blinker-2" />
      <line x1="16" y1="5" x2="40" y2="5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Scan Line Effect -->
    <g clip-path="url(#phoneClip)">
      <line class="scanner" x1="8" y1="20" x2="102" y2="20" stroke="#38bdf8" stroke-width="2" opacity="0.8" filter="url(#subtleGlow)" />
    </g>
    <clipPath id="phoneClip">
      <rect x="7" y="12" width="96" height="186" rx="14" />
    </clipPath>
  </g>

  <!-- Right Dynamic Device Element (Tablet / Cloud Device Farm Node) -->
  <g class="floating-tablet" transform="translate(1015, 85)">
    <!-- Tablet Shadow -->
    <rect x="10" y="15" width="130" height="195" rx="18" fill="#000000" opacity="0.5" filter="url(#glow)" />
    <!-- Tablet Body -->
    <rect x="0" y="0" width="130" height="195" rx="18" fill="#0f172a" stroke="url(#cyanPurple)" stroke-width="2.5" />
    <!-- Tablet Screen -->
    <rect x="8" y="10" width="114" height="175" rx="12" fill="#030712" />

    <!-- Radar Pulse in Device Farm Node -->
    <g transform="translate(65, 75)">
      <circle cx="0" cy="0" r="6" fill="#818cf8" />
      <circle class="radar" cx="0" cy="0" r="10" fill="none" stroke="#38bdf8" />
      <circle class="radar-delayed" cx="0" cy="0" r="10" fill="none" stroke="#c084fc" />
    </g>

    <text x="65" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">LIVE CLOUD</text>
    
    <!-- Mini Fleet Status Bars -->
    <rect x="22" y="142" width="86" height="6" rx="3" fill="#1e293b" />
    <rect x="22" y="142" width="62" height="6" rx="3" fill="url(#cyanPurple)" />
    
    <rect x="22" y="156" width="86" height="6" rx="3" fill="#1e293b" />
    <rect x="22" y="156" width="76" height="6" rx="3" fill="#10b981" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, & Feature Pills -->
  <g transform="translate(600, 0)" text-anchor="middle">
    
    <!-- Top Pill / Category Tag -->
    <g transform="translate(0, 68)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7" filter="url(#subtleGlow)" />
      <circle cx="-140" cy="0" r="4.5" fill="#38bdf8" class="blinker-1" />
      <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe" letter-spacing="2">MOBILE CLOUD &amp; REAL DEVICE FARMS</text>
    </g>

    <!-- Main Title (Ensured permanently in foreground) -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Awesome Mobile Testing Cloud
    </text>

    <!-- Subtitle (Clear, readable, unaffected by background animations) -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Commercial SaaS Platforms &amp; Self-Hosted Open-Source Device Clouds
    </text>
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#cbd5e1" opacity="0.9">
      Android 🤖 • iOS 🍏 • Appium • Real Device Fleets • Automated &amp; Manual QA
    </text>

    <!-- Interactive / Highlighting Feature Badges Row -->
    <g transform="translate(0, 275)">
      <!-- Badge 1: Real Devices -->
      <g transform="translate(-250, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
        <circle cx="-46" cy="0" r="3.5" fill="#38bdf8" />
        <text x="4" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Real Devices</text>
      </g>
      <!-- Badge 2: Open Source -->
      <g transform="translate(-85, 0)">
        <rect x="-75" y="-18" width="150" height="36" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
        <circle cx="-50" cy="0" r="3.5" fill="#818cf8" />
        <text x="6" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Open-Source</text>
      </g>
      <!-- Badge 3: Commercial SaaS -->
      <g transform="translate(85, 0)">
        <rect x="-75" y="-18" width="150" height="36" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" />
        <circle cx="-50" cy="0" r="3.5" fill="#a78bfa" />
        <text x="6" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Hosted SaaS</text>
      </g>
      <!-- Badge 4: Appium / CI/CD -->
      <g transform="translate(250, 0)">
        <rect x="-70" y="-18" width="140" height="36" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
        <circle cx="-46" cy="0" r="3.5" fill="#34d399" />
        <text x="4" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Appium &amp; CI/CD</text>
      </g>
    </g>

    <!-- Bottom Metrics Info Pill -->
    <g transform="translate(0, 345)">
      <rect x="-240" y="-15" width="480" height="30" rx="15" fill="#090d16" stroke="#334155" stroke-width="1" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
        ⚡ 30,000+ Cloud Devices • 10+ Open-Source Frameworks • Zero Flakiness
      </text>
    </g>

  </g>
</svg>
